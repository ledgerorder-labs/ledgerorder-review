name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ledgerorder-review
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: ledgerorder-review
      - run: npm run demo
        working-directory: ledgerorder-review
